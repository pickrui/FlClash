repos:
  - repo: local
    hooks:
      - id: private-sources
        name: verify private source references
        entry: python3 .private-build/prepare.py . check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: dart-format
        name: dart format
        entry: dart format
        language: system
        files: \.dart$
        stages: [pre-commit]
      - id: comment-density
        name: comment density
        entry: tool/check_comment_density.sh
        language: system
        files: \.(dart|kt|kts|swift|go|rs|java|cpp|cc|h|hpp|gradle|ya?ml)$
        stages: [pre-commit]
      # `flutter analyze` dies on this workspace's non-ASCII path.
      - id: dart-analyze
        name: dart analyze (pre-push)
        entry: dart analyze lib test tool
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: commit-msg-format
        name: conventional commit message
        entry: tool/check_commit_msg.sh
        language: system
        stages: [commit-msg]
