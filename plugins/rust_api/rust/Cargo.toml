[package]
name = "rust_api"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
rquickjs = { version = "0.12", default-features = false }

[target.'cfg(not(target_os = "android"))'.dependencies]
interprocess = "2"
global-hotkey = "0.8"

[target.'cfg(all(unix, not(target_os = "android")))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"

[target.'cfg(target_os = "android")'.dependencies]
rquickjs = { version = "0.12", default-features = false, features = ["bindgen"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[dev-dependencies]
serde_json = "1"
