name: Prepare private build sources
description: Restore authorized build inputs
inputs:
  source-key:
    description: Read-only key for the private source repository
    required: true
runs:
  using: composite
  steps:
    - name: Protect Windows checkout credentials
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $owner = [System.Security.Principal.WindowsIdentity]::GetCurrent().User
        $acl = [System.Security.AccessControl.DirectorySecurity]::new()
        $acl.SetOwner($owner)
        $acl.SetAccessRuleProtection($true, $false)
        foreach ($sid in @($owner.Value, 'S-1-5-18', 'S-1-5-32-544')) {
          $identity = [System.Security.Principal.SecurityIdentifier]::new($sid)
          $rule = [System.Security.AccessControl.FileSystemAccessRule]::new(
            $identity, 'FullControl', 'ContainerInherit,ObjectInherit', 'None', 'Allow')
          $acl.AddAccessRule($rule)
        }
        Set-Acl -LiteralPath $env:RUNNER_TEMP -AclObject $acl
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: pickrui/FlClash-private
        ref: 5bb618c98e6fed6b0daa6596b7ed38108037a938
        path: .private-build
        ssh-key: ${{ inputs.source-key }}
        persist-credentials: false
    - shell: bash
      run: python .private-build/prepare.py .
