name: Android system image verification
on:
  workflow_dispatch:
permissions: {}
jobs:
  verify:
    if: github.repository == 'pickrui/FlClash' && github.ref == 'refs/heads/main' && github.actor == 'pickrui' && github.triggering_actor == 'pickrui' && github.sha == vars.FLCLASH_RECOVERY_WORKFLOW_SHA
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Boot and verify Android x86_64 with 16 KB pages
        shell: bash
        run: |
          set -euo pipefail
          image='system-images;android-35;google_apis_ps16k;x86_64'
          sdk="$ANDROID_HOME"
          adb="$sdk/platform-tools/adb"
          emulator="$sdk/emulator/emulator"
          mkdir -p "$RUNNER_TEMP/android-avd"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          "$sdk/cmdline-tools/latest/bin/sdkmanager" "$image" emulator platform-tools >/dev/null
          echo no | "$sdk/cmdline-tools/latest/bin/avdmanager" create avd --force -n validation -k "$image" --device pixel_6 >/dev/null
          "$emulator" -list-avds | grep -Fx validation
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          "$emulator" -accel-check
          df -h "$ANDROID_AVD_HOME"
          "$adb" start-server
          "$emulator" -avd validation -port 5556 -no-window -gpu software -no-snapshot -no-audio -no-boot-anim -camera-back none -camera-front none -no-metrics >"$RUNNER_TEMP/emulator-log" 2>&1 &
          pid=$!
          serial=emulator-5556
          a() { "$adb" -s "$serial" "$@"; }
          cleanup_emulator() {
            result=$?
            if [[ $result != 0 ]]; then
              grep -Ei 'error|warning|fatal|panic|disk|accel|unsupported|kvm|failed|avd|gpu' "$RUNNER_TEMP/emulator-log" | tail -40 || true
            fi
            a emu kill >/dev/null 2>&1 || true
            if kill -0 "$pid" 2>/dev/null; then kill "$pid" 2>/dev/null || true; fi
            wait "$pid" 2>/dev/null || true
          }
          trap cleanup_emulator EXIT
          for _ in $(seq 1 70); do
            if [[ $(a get-state 2>/dev/null || true) == device ]]; then break; fi
            kill -0 "$pid" || exit 1
            sleep 2
          done
          test "$(a get-state)" = device
          for _ in $(seq 1 120); do
            if [[ $(a shell getprop sys.boot_completed 2>/dev/null | tr -d '\r') == 1 ]]; then break; fi
            kill -0 "$pid"
            sleep 2
          done
          test "$(a shell getprop sys.boot_completed | tr -d '\r')" = 1
          a root >/dev/null
          a wait-for-device
          test "$(a shell getconf PAGE_SIZE | tr -d '\r')" = 16384
          test "$(a shell getprop ro.product.cpu.abi | tr -d '\r')" = x86_64
