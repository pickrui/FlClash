name: Desktop build checks
run-name: Desktop ${{ inputs.platform }} (${{ inputs.arch }})

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform
        type: choice
        options: [windows, macos]
        required: true
      arch:
        description: Native runner architecture
        type: choice
        options: [amd64, arm64]
        required: true

permissions:
  contents: read

env:
  MSYS_NO_PATHCONV: 1

jobs:
  desktop:
    name: Build ${{ inputs.platform }} (${{ inputs.arch }})
    runs-on: ${{ inputs.platform == 'macos' && (inputs.arch == 'arm64' && 'macos-latest' || 'macos-15-intel') || (inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-2022') }}
    timeout-minutes: 60
    steps:
      - name: Install native Windows ARM Rust toolchain
        if: inputs.platform == 'windows' && inputs.arch == 'arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.9'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Use the same tagged SDK checkout as release builds; this also
          # supports Windows ARM without a prebuilt stable SDK archive.
          channel: master
          flutter-version: '3.47.6'
          cache: ${{ inputs.platform != 'windows' }}
      - name: Setup Xcode
        if: inputs.platform == 'macos'
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Disable Impeller on Intel macOS
        if: inputs.platform == 'macos' && inputs.arch == 'amd64'
        run: plutil -replace FLTEnableImpeller -bool NO macos/Runner/Info.plist

      - run: flutter pub get
      - name: Prepare isolated Core settings
        if: inputs.platform == 'macos'
        shell: bash
        run: |
          set -e
          cat > "$RUNNER_TEMP/prepare_core_fixture.dart" <<'DART'
          import 'dart:io';
          import 'package:setup_hooks/src/secrets.dart';
          void main() {
            CoreBuildSecrets.load(rootDir: Directory.current.path, environment: const {
              'DNS_AUTH_PRIVATE_KEY': 'fixture-only-not-a-production-key',
              'DNS_AUTH_DOMAINS': 'example.invalid',
            }, requireSecrets: true);
          }
          DART
          dart --packages="$GITHUB_WORKSPACE/.dart_tool/package_config.json" "$RUNNER_TEMP/prepare_core_fixture.dart"
      - name: Build unsigned release fixture
        if: inputs.platform == 'macos'
        shell: bash
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          FLUTTER_XCODE_ARCHS: ${{ inputs.arch == 'arm64' && 'arm64' || 'x86_64' }}
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: flutter build "$BUILD_PLATFORM" --release --verbose --no-pub
      - name: Package Windows release fixtures
        if: inputs.platform == 'windows'
        shell: pwsh
        env:
          BUILD_ARCH: ${{ inputs.arch }}
          PROFILE_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          DNS_AUTH_PRIVATE_KEY: AAECAwQFBgcICQoLDA0ODxAREhMUFRYXGBkaGxwdHh8=
          DNS_AUTH_DOMAINS: example.invalid
          BASE_DOMAIN: example.invalid
          SPARE_DOMAIN: example.invalid
          API_DOMAIN: example.invalid
          SPARE_API_DOMAIN: example.invalid
          FLCLASH_APP_SECRET: windows-package-fixture
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          dart setup.dart windows --arch $env:BUILD_ARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tool/check_windows_package.py --arch $env:BUILD_ARCH
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save Windows release fixtures
        if: always() && inputs.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-package-fixture-${{ inputs.arch }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/flclash-windows-${{ inputs.arch }}.exe
            dist/flclash-windows-${{ inputs.arch }}.zip
            dist/windows-package-${{ inputs.arch }}.json
      - name: Print native hook diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          for path in Path('.dart_tool').rglob('stderr.txt'):
              print(str(path))
              print(path.read_text(errors='replace'))
          path = Path('.dart_tool/setup_build_cache/hook.log')
          if path.exists():
              print(path.read_text(errors='replace'))
          PYTHON
      - name: Save native hook diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-diagnostics-${{ inputs.platform }}-${{ inputs.arch }}
          include-hidden-files: true
          path: |
            .dart_tool/hooks_runner/**/stderr.txt
            .dart_tool/hooks_runner/**/stdout.txt
            .dart_tool/setup_build_cache/hook.log
          if-no-files-found: ignore
