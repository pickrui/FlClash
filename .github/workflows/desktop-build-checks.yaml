name: Desktop build checks
run-name: Desktop ${{ inputs.platform }} (${{ inputs.arch }})

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop platform
        type: choice
        options: [windows, macos]
        required: true
      arch:
        description: Native runner architecture
        type: choice
        options: [amd64, arm64]
        required: true

env:
  MSYS_NO_PATHCONV: 1

jobs:
  desktop:
    name: Build ${{ inputs.platform }} (${{ inputs.arch }})
    runs-on: ${{ inputs.platform == 'macos' && (inputs.arch == 'arm64' && 'macos-latest' || 'macos-15-intel') || (inputs.arch == 'arm64' && 'windows-11-arm' || 'windows-2022') }}
    timeout-minutes: 35
    steps:
      - name: Install native Windows ARM Rust toolchain
        if: inputs.platform == 'windows' && inputs.arch == 'arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          # Use the same tagged SDK checkout as release builds; this also
          # supports Windows ARM without a prebuilt stable SDK archive.
          channel: master
          flutter-version: '3.44.6'
          cache: ${{ inputs.platform != 'windows' }}
      - run: flutter pub get
      - name: Prepare isolated Core settings
        shell: bash
        run: |
          set -e
          cat > "$RUNNER_TEMP/prepare_core_fixture.dart" <<'DART'
          import 'dart:io';
          import 'package:setup_hooks/src/secrets.dart';
          void main() {
            CoreBuildSecrets.load(rootDir: Directory.current.path, environment: const {
              'DNS_AUTH_PRIVATE_KEY': 'fixture-only-not-a-production-key',
              'DNS_AUTH_DOMAINS': 'example.invalid',
            }, requireSecrets: true);
          }
          DART
          dart --packages="$GITHUB_WORKSPACE/.dart_tool/package_config.json" "$RUNNER_TEMP/prepare_core_fixture.dart"
      - name: Build unsigned release fixture
        shell: bash
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
          FLUTTER_XCODE_ARCHS: ${{ inputs.arch == 'arm64' && 'arm64' || 'x86_64' }}
          FLUTTER_XCODE_CODE_SIGNING_ALLOWED: 'NO'
          MACOSX_DEPLOYMENT_TARGET: '12.0'
        run: flutter build "$BUILD_PLATFORM" --release --verbose --no-pub
      - name: Print native hook diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          for path in Path('.dart_tool').rglob('stderr.txt'):
              print(str(path))
              print(path.read_text(errors='replace'))
          path = Path('.dart_tool/setup_build_cache/hook.log')
          if path.exists():
              print(path.read_text(errors='replace'))
          PYTHON
      - name: Save native hook diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics-${{ inputs.platform }}-${{ inputs.arch }}
          include-hidden-files: true
          path: |
            .dart_tool/hooks_runner/**/stderr.txt
            .dart_tool/hooks_runner/**/stdout.txt
            .dart_tool/setup_build_cache/hook.log
          if-no-files-found: ignore
