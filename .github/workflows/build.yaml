name: build

on:
  push:
    tags:
      - 'v*'

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.44.6'
  GO_VERSION: '1.26.8'
  MSYS_NO_PATHCONV: 1

permissions:
  contents: read

jobs:
  version:
    name: Generate Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      deep_tests: ${{ steps.scope.outputs.deep_tests }}
      go_version: ${{ env.GO_VERSION }}
      full_version: ${{ steps.version.outputs.full_version }}
      flutter_version: ${{ env.FLUTTER_VERSION }}
      version_number: ${{ steps.version.outputs.version_number }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine required Go test scope
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/release_checks.py scope

      - name: Validate release checks
        run: python3 -m unittest discover -s test/ci -v

      - name: Generate Version
        id: version
        env:
          TZ: Asia/Shanghai
        run: |
          set -euo pipefail
          VERSION_NUMBER=$(grep -E "^version:" pubspec.yaml | sed -E 's/^version:[[:space:]]*([0-9.]+).*/\1/')
          # One actual build date for every platform and architecture in this run.
          # The checked-in suffix is a snapshot, never a minimum build number.
          BUILD_NUMBER=$(date '+%Y%m%d%H')

          FULL_VERSION="${VERSION_NUMBER}+${BUILD_NUMBER}"
          
          echo "version_number=$VERSION_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"
          
          echo "Generated version: $FULL_VERSION"
          echo "  Version number: $VERSION_NUMBER"
          echo "  Build number: $BUILD_NUMBER"

  test:
    name: Dart analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Build routing test tools
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: |
          go build -tags with_gvisor -trimpath -o "$RUNNER_TEMP/FlClashCore" .
          go test -tags with_gvisor -c -o "$RUNNER_TEMP/flclash-routing-checker" .

      - name: Cache Rust test library
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/rust_api/rust/target
          key: ${{ runner.os }}-${{ runner.arch }}-script-test-cargo-${{ hashFiles('plugins/rust_api/rust/Cargo.lock', 'plugins/rust_api/rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-script-test-cargo-

      - name: Build native script test library
        run: cargo build --locked --manifest-path plugins/rust_api/rust/Cargo.toml

      - name: Skip hooks for explicitly built unit-test fixtures
        run: dart tool/set_native_build_assets.dart false

      - name: Validate build hooks
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

      - name: Run tests
        env:
          FLCLASH_TEST_SCRIPT_LIB: ${{ github.workspace }}/plugins/rust_api/rust/target/debug/librust_api.so
          FLCLASH_TEST_CORE: ${{ runner.temp }}/FlClashCore
          FLCLASH_TEST_ROUTING_CHECKER: ${{ runner.temp }}/flclash-routing-checker
        run: flutter test --reporter expanded test plugins/proxy/test/proxy_test.dart plugins/wifi_ssid/test plugins/tray/test

  go-test:
    name: Go core tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - name: Validate Go core
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: |
          go vet -tags with_gvisor ./...
          go test -tags with_gvisor ./...
          cd Clash.Meta
          go test -tags with_gvisor ./component/mmdb ./component/updater
      - name: Check native callback and file ownership races
        working-directory: core
        run: |
          go test -race tun_callbacks.go tun_callbacks_test.go
          go test -race ownership_unix.go ownership_test.go ownership_stat_linux_test.go

  deep-tests:
    name: Deep Go checks
    needs: version
    if: needs.version.outputs.deep_tests == 'true'
    uses: ./.github/workflows/go-deep-tests.yaml
    with:
      go-version: ${{ needs.version.outputs.go_version }}

  android-core-test:
    name: Android core (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, arm, amd64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
      - name: Compile and link Android core and JNI
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash tool/check_android_core.sh '${{ matrix.arch }}'

  android-test:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Run Android unit tests
        working-directory: android
        run: |
          set -euo pipefail
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
          } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache --android
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :service:testDebugUnitTest :common:testDebugUnitTest \
            -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug --no-daemon

  android-native-test:
    name: Android Native Assets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
      - name: Install script binding dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - name: Cache Android Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .dart_tool/hooks_runner/shared/rust_api/build/*/target
          key: ${{ runner.os }}-android-native-${{ env.FLUTTER_VERSION }}-${{ hashFiles('plugins/rust_api/rust/Cargo.lock', 'plugins/rust_api/rust/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-android-native-${{ env.FLUTTER_VERSION }}-
      - name: Compile Android Native Assets for all supported ABIs
        run: |
          dart tool/set_native_build_assets.dart false
          dart tool/set_native_build_assets.dart true rust_api
          for target in android-arm64 android-arm android-x64; do
            flutter build bundle --debug --target-platform "$target"
          done

  rust-test:
    name: Rust components
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/rust_api/rust/target
            services/helper/target
          key: ${{ runner.os }}-test-cargo-${{ hashFiles('plugins/rust_api/rust/Cargo.lock', 'services/helper/Cargo.lock') }}
      - name: Validate Rust components
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo test --manifest-path services/helper/Cargo.toml
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

  windows-helper-test:
    name: Windows helper test
    needs: version
    uses: ./.github/workflows/windows-tests.yaml
    with:
      flutter-version: ${{ needs.version.outputs.flutter_version }}

  build:
    name: "Build ${{ matrix.name }}"
    needs: [version, go-test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
            arch: arm64
            name: "Android (arm64)"
          - platform: android
            os: ubuntu-latest
            arch: arm
            name: "Android (arm)"
          - platform: android
            os: ubuntu-latest
            arch: amd64
            name: "Android (x64)"
          - platform: windows
            os: Windows-2022
            arch: amd64
            name: "Windows (x64)"
          - platform: windows
            os: windows-11-arm
            arch: arm64
            name: "Windows (arm64)"
          - platform: macos
            os: macos-15-intel
            arch: amd64
            name: "macOS (Intel x64)"
          - platform: macos
            os: macos-latest
            arch: arm64
            name: "macOS (Apple Silicon)"
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
            name: "Linux (x64)"
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
            name: "Linux (arm64)"

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > android/app/keystore.jks
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: ${{ matrix.platform != 'windows' }}

      - name: Cache Gradle
        if: matrix.platform == 'android'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            plugins/rust_api/rust/target
            services/helper/target
            .dart_tool/hooks_runner/shared/rust_api/build/*/target
          key: ${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-cargo-v2-${{ env.FLUTTER_VERSION }}-${{ hashFiles('plugins/rust_api/rust/Cargo.lock', 'services/helper/Cargo.lock', '**/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.platform }}-${{ matrix.arch }}-cargo-v2-${{ env.FLUTTER_VERSION }}-

      - name: Cache CocoaPods
        if: matrix.platform == 'macos'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods
            ~/Library/Caches/CocoaPods
            macos/Pods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('macos/Podfile', 'macos/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Cache npm
        if: matrix.platform == 'macos'
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('setup.dart') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup macOS Signing
        if: matrix.platform == 'macos'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/devid_cert.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          # Decode the base64 Developer ID certificate (.p12)
          printf '%s' "$MACOS_CERTIFICATE" | openssl enc -base64 -d -A > "$CERT_PATH"
          # Create a dedicated temporary keychain and make it searchable
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          # Import the Apple Developer ID intermediate CA so the chain is complete (best-effort)
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer" && security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN_PATH" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Prepend the temp keychain to the search list (keep existing ones)
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$CERT_PATH"
          echo "Available Developer ID signing identities:"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Install Android script binding dependencies
        if: matrix.platform == 'android'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Build Application
        id: build
        shell: bash
        env:
          FLUTTER_VERSION_NUMBER: ${{ needs.version.outputs.version_number }}
          FLUTTER_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          PROFILE_KEY: ${{ secrets.PROFILE_KEY }}
          BASE_DOMAIN: ${{ secrets.BASE_DOMAIN }}
          SPARE_DOMAIN: ${{ secrets.SPARE_DOMAIN }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          SPARE_API_DOMAIN: ${{ secrets.SPARE_API_DOMAIN }}
          FLCLASH_APP_SECRET: ${{ secrets.FLCLASH_APP_SECRET }}
          DNS_AUTH_PRIVATE_KEY: ${{ secrets.DNS_AUTH_PRIVATE_KEY }}
          DNS_AUTH_DOMAINS: ${{ secrets.DNS_AUTH_DOMAINS }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'macos' && '12.0' || '' }}
        run: |
          set -e
          BUILD_ARGS="${{ matrix.platform }}"
          [ -n "${{ matrix.arch }}" ] && BUILD_ARGS="$BUILD_ARGS --arch ${{ matrix.arch }}"
          BUILD_ARGS="$BUILD_ARGS --out app"
          [ "${{ env.IS_STABLE }}" == "true" ] && BUILD_ARGS="$BUILD_ARGS --env stable"
          dart setup.dart $BUILD_ARGS

          if [ ! -d ./dist ] || [ -z "$(find ./dist -type f -print -quit)" ]; then
            echo "Build produced no artifacts in ./dist" >&2
            exit 1
          fi
          
          find ./dist -name "*.exe" -type f -exec sh -c 'mv "$1" "${1%.exe}-setup.exe"' _ {} \;
          find ./dist -name "*.appimage" -type f -exec sh -c 'mv "$1" "${1%.appimage}.AppImage"' _ {} \;

      - name: Verify final Android APK version
        if: matrix.platform == 'android'
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.version_number }}
          RELEASE_BUILD: ${{ needs.version.outputs.build_number }}
        run: python3 tool/check_apk_version.py --version "$RELEASE_VERSION" --build "$RELEASE_BUILD" dist/*.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true
          if-no-files-found: error

  checks:
    name: Required release checks
    if: ${{ always() }}
    needs: [version, test, go-test, deep-tests, android-core-test, android-test, android-native-test, rust-test, windows-helper-test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every applicable check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tool/release_checks.py gate

  upload:
    permissions:
      actions: read
      contents: write
    needs: [ version, build, checks ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release.md
        run: |
          tag="${{ github.ref_name }}"
          out="release.md"
          awk -v heading="## $tag" '
            $0 == heading { found=1; capture=1; next }
            capture && /^## / { exit }
            capture { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$out"
          if ! grep -q '[^[:space:]]' "$out"; then
            echo "No changelog entries found for $tag" >&2
            exit 1
          fi

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: './release.md'

      - name: Update Version via oixCloud API
        if: success() && env.IS_STABLE == 'true'
        continue-on-error: true
        run: |
          API_KEY="${{ secrets.FLCLASH_KEY }}"
          API_URL="https://${{ secrets.API_DOMAIN }}/api/v1/version/update"
          FULL_VERSION="${{ needs.version.outputs.full_version }}"
          
          if [ -z "$API_KEY" ]; then
            echo "⚠️  Skipping version update: API_KEY secret not configured"
            exit 0
          fi
          
          if [ -z "$FULL_VERSION" ]; then
            echo "❌ Error: Version number not available"
            exit 1
          fi
          
          echo "📦 Updating oixCloud version to: $FULL_VERSION"
          
          response=$(curl -s -w "\n%{http_code}" -X POST "$API_URL" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "key=$API_KEY" \
            --data-urlencode "version=$FULL_VERSION")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          ret_code=$(echo "$body" | grep -oE '"ret"[[:space:]]*:[[:space:]]*[0-9]+' | grep -oE '[0-9]+$' || echo "")

          echo "Response body: $body"
          echo "HTTP status: $http_code   Business ret: ${ret_code:-<none>}"

          if [ "$http_code" = "200" ] && [ "$ret_code" = "200" ]; then
            echo "✅ Version updated successfully on oixCloud"
            echo "   Version: $FULL_VERSION"
            echo "   API: $API_URL"
          else
            echo "❌ Failed to update version"
            echo "   HTTP Status: $http_code"
            echo "   Business ret: ${ret_code:-<none>}"
            echo "   Response: $body"
            exit 1
          fi
